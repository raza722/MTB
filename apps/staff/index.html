<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MTB Staff</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("mtb.theme");
          var accent = localStorage.getItem("mtb.accent");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          root.setAttribute("data-theme", theme);
          if (accent === "navy" || accent === "green") root.setAttribute("data-accent", accent);
        } catch (e) {
          /* storage blocked: keep defaults */
        }
      })();
    </script>
  </head>
  <body class="mtb-root">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
